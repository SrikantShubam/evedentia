[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidentia"
version = "0.1.0"
description = "Deterministic demand-to-product pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1,<9",
  "pydantic>=2.7,<3",
  "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
]

[project.scripts]
evidentia = "evidentia.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: marks tests that are guarded from live execution by default",
]
