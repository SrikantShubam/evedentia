# Scope intentionally narrowed per NEXT_PIVOT.md Week 1 reset.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evidentia"
version = "0.1.0"
description = "Deterministic demand-to-product pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "click>=8.1,<9",
  "pydantic>=2.7,<3",
  "pyyaml>=6.0,<7",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sse-starlette>=2.1,<3",
  "ddgs>=9.0,<10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "httpx>=0.27,<1",
]

[project.scripts]
evidentia = "evidentia.cli:cli"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: real network calls; not for CI",
  "integration: multi-component flows; may require local services",
]
